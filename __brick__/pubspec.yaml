name: {{packageName}}
description: "Flutter app"

publish_to: 'none'

version: 0.0.1

environment:
  sdk: ^3.13.5
  flutter: ">=3.47.7"

dependencies:
  auto_route: ^11.2.0
  bloc_concurrency: ^0.3.0
  cached_network_image: ^4.0.4
  collection: ^1.19.1
  connectivity_plus: ^7.3.2
  cupertino_icons: ^2.0.0
  dio: ^5.11.1
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  flutter_svg: ^2.3.0
  flutter_web_plugins:
    sdk: flutter
  freezed_annotation: ^3.1.0
  get_it: ^9.3.0
  google_fonts: ^9.0.0
  hive_ce: ^2.22.0
  hive_ce_flutter: ^2.5.0
  hydrated_bloc: ^11.0.0
  image_picker: ^1.2.4
  injectable: ^3.0.0
  intl: ^0.20.3
  json_annotation: ^4.12.0
  logging: ^1.3.0
  package_info_plus: ^10.2.2
  path_provider: ^2.1.6
  permission_handler: ^13.0.2
  retrofit: ^4.10.0
  uuid: ^4.6.0

dev_dependencies:
  alchemist: ^0.14.1
  arb_utils: ^0.11.1
  auto_translator: ^2.3.5
  bloc_test: ^10.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5
  path: ^1.9.1
  yaml: ^3.1.4

flutter_gen:
  integrations:
    flutter_svg: true

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/
    - assets/icons/
